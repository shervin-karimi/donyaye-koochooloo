name: donyaye_koochooloo
description: An offline Persian-first learning and play app for children.
publish_to: none
version: 0.1.0+1

environment:
  sdk: ^3.10.0

dependencies:
  video_player: ^2.10.1
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any # Uses the version pinned by flutter_localizations.

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  video_player_platform_interface: ^6.4.0

flutter:
  generate: true
  uses-material-design: true
  assets:
    - assets/media/
